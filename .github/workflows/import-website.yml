name: Import website files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website ZIP
        run: |
          unzip -q shrinimbark-website-v1.zip -d /tmp/site
          cp -a /tmp/site/shrinimbark-nextjs/. .
          rm shrinimbark-website-v1.zip

      - name: Save website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Shri Nimbark website files"
          git push
